<script>
const stories = [
 {id:1,title:"ছায়াকোটাল",author:"IMRANUL AMIN",cover:"https://placehold.co/400x550/242424/c7a878?text=CHHAYAKOTAL",episodes:[
  {title:"প্রথম পর্ব",content:"বাইরে কালিন্দী নদীর ওপর থেকে উঠে আসা কালচে কুয়াশা শহরের প্রতিটি ল্যাম্পপোস্টকে একেকটা ঝাপসা হলুদ প্রেতাত্মার মতো বানিয়ে রেখেছিল। সেই ঘোলাটে কুয়াশায় নদীর পচা পাটের গন্ধ, ভিজে মাটির সোঁদা গন্ধ আর কালিন্দীঘাট জুট মিলের কয়লার ধোঁয়া মিলেমিশে বাতাসকে এতটাই বিষাক্ত করে তুলেছিল যে প্রতিটি নিঃশ্বাসে বুক ভারী হয়ে আসছিল। ঘরের একমাত্র কাচের শেড দেওয়া টেবিল ল্যাম্পের তলায় আমি যখন পুরোনো জমিজমার নথির ওপর ম্যাগনিফাইং গ্লাসটা নামিয়ে রাখলাম, ঠিক তখনই বাইরের দরজায় সেই পরিচিত শুকনো করাঘাতটা হলো। তিনবার—খানিকটা থেমে আরও দুবার। পুলিশের বিশেষ বার্তাবাহক কনস্টেবল হারান মাঝির গোপন সংকেত।

দরজা খুলতেই ঘরের ভেতরে হুড়মুড় করে ঢুকে পড়ল কালিন্দীর ভিজে বাদুড়ে হাওয়া, পচা নদীর শ্যাওলা আর অতিরিক্ত কার্বলিক অ্যাসিডের ঝাঁঝালো গন্ধ। হারানের গায়ে কালো রবারাইজড রেইনকোট, সেখান থেকে চুইয়ে চুইয়ে জল পড়ছে মেঝেতে। তার চোখের কোলে কালি, চিবুক কাঁপছে। সে এক মুহূর্তের জন্যও আমার চোখের দিকে তাকাল না। যেন আমার মুখের দিকে সরাসরি তাকালে কোনো নিষিদ্ধ পাপের ভাগীদার হতে হবে। সে তার বুকের সাথে চেপে ধরে রাখা একটা মরচে-পড়া লোহার ডিসপ্যাচ বাক্স আমার পুরোনো মেহগনি কাঠের টেবিলের ওপর সশব্দে নামিয়ে রাখল। বাক্সের ডালায় লাল গালা আর পুলিশ সুপারের সিলের মতো গাঢ় হরফে ছাপ মারা: 'অজ্ঞাতনামা শব নং ০৭—কালিন্দীঘাট মহকুমা মর্গ'।

"বড়বাবু পাঠালেন, অদ্রীশবাবু," হারানের গলা এমনভাবে কাঁপছিল যেন কোনো বরফশীতল পাতালঘর থেকে কথা বলছে। সে ঘরের চারপাশের অন্ধকার কোণে রাখা শতবর্ষী নথিপত্র আর হলুদ বইয়ের তাকগুলোর দিকে আড়চোখে তাকাল। "কালিন্দীর বাঁকে পন্টুন জেটির তলায় ভাসমান জালে পাওয়া গেছে লাশটা। বড়বাবু আর ডাক্তার রক্ষিত মর্গ থেকে কাউকে বাইরে বেরোতে দিচ্ছেন না। চারদিকে সশস্ত্র পাহারা বসেছে। ডাক্তারবাবু বললেন, এই বাক্সের ভেতরে যে ভেজা চামড়ায় মোড়ানো ছোট ডায়েরিটা পাওয়া গেছে, তার পাতাগুলো জলে ভিজে জমাট বেঁধে একে অপরের সাথে পাথরের মতো সেঁটে গেছে। এই গোটা জেলায় একমাত্র আপনিই নাকি রাসায়নিক বাষ্প দিয়ে এই পচা কাগজের হরফ উদ্ধার করতে পারেন।"

আমি কিছু বলার আগেই হারান মাঝি আর এক মুহূর্তও দাঁড়াল না। সে প্রায় উন্মত্তের মতো দরজা ঠেলে বেরিয়ে রাতের ঘন কুয়াশায় মিলিয়ে গেল। কাঠের সিঁড়িতে তার ভেজা গামবুটের থপ-থপ শব্দ দ্রুত দূরে মিলিয়ে গেল। যেন এই ঘরে আর কয়েক সেকেন্ড দাঁড়িয়ে থাকা মানেই মৃত্যুর হিমেল স্পর্শ গায়ে মেখে নেওয়া।

আমি সাবধানে দরজাটা ভেতর থেকে ছিটকিনি তুলে দিলাম। আমার কাজ কালিন্দীঘাট দায়রা আদালতের প্রাচীন মহাফেজখানার শতবর্ষী কীটদষ্ট নথিপত্র, অগ্নিকাণ্ডে ক্ষতিগ্রস্ত উইল, অ্যাসিডে পোড়া জমিজমার মানচিত্র রাসায়নিক প্রক্রিয়ায় পাঠযোগ্য করে তোলা। পুলিশের মর্গের ডিসপ্যাচ বাক্স আমার টেবিলে এই প্রথম নয়। কালিন্দী নদী যেন গোটা উত্তরবঙ্গের সব অপরাধ, আত্মহত্যা আর রক্তের ভাগাড়। নদীর জোয়ারে কত গলিত শব ভেসে আসে, কত মানুষের অতীত আর পরিচয় এই ঘোলা জলে চিরতরে মুছে যায়।

টেবিলের ওপর রাখা ধাতব বাক্সের সীলগালা কাটলাম। ক্যাঁচক্যাচ শব্দে ঢাকনা খুলতেই নাকে এল তীব্র এক সুবাস—কিন্তু তা ফর্মালিনের নয়, হাসপাতালের কার্বলিকেরও নয়। এটি ছিল মিষ্টি অথচ তীক্ষ্ণ তিতা কাঠবাদামের গন্ধ। যে কোনো রসায়নের ছাত্র জানে, তিতা বাদামের এই বিশেষ গন্ধ কিসের পূর্বাভাস দেয়—পটাসিয়াম সায়ানাইড বা হাইড্রোসায়ানিক অ্যাসিডের অবশিষ্টাংশ।

বাক্সের ভেতর রাখা ছিল একটি ভেজা মোমজামার থলি। তার ভেতর থেকে বেরিয়ে এল একটি কাচের জার আর পকেট সাইজের একটি বাদামি চামড়ার ডায়েরি। ডায়েরিটির চামড়া জলে ভিজে স্যাঁতসেঁতে হয়ে ফুলে উঠেছে, তার খাঁজে খাঁজে নদীর কালো পলিমাটি জমে আছে। আমি চিমটে দিয়ে ডায়েরিটা তুলে স্টিমার প্লেটের ওপর রাখলাম। অ্যামাইল অ্যাসিটেট আর ইথাইল অ্যালকোহলের মৃদু বাষ্প দিয়ে সাবধানে চামড়ার ওপরের শ্যাওলা পরিষ্কার করতেই বুকের ভেতর এক অদ্ভুত অস্বস্তি শুরু হলো। চামড়াটি কোনো বাছুরের বা হরিণের নয়; এর সূক্ষ্ম রোমকূপের বিন্যাস আর তৈলাক্ত পিচ্ছিল ভাব চিকিৎসাবিজ্ঞানের কোনো এক নারকীয় স্মৃতি জাগিয়ে তুলছিল।

অতিবেগুনি রশ্মির ইউভি ল্যাম্পটা জ্বালিয়ে ডায়েরির ওপরের কাদা সাবধানে উটের লোমের নরম তুলি দিয়ে সরালাম। চামড়ার মলাটে একসময় সোনালি হরফে কিছু নাম খোদাই করা ছিল, যা ধারালো ব্লেড দিয়ে কুড়ে কুড়ে তুলে ফেলা হয়েছে। তবে প্রথম ভেজা পাতাটা কাচের স্প্যাচুলা দিয়ে আলগা করতেই আমার মেরুদণ্ড বেয়ে এক জমাট বরফের স্রোত নেমে গেল। আমার হাত অবশ হয়ে কাচের স্প্যাচুলাটা টেবিলের ওপর খসে পড়ল।

কাগজটা উনিশ শতকের শেষভাগের অ্যাসিডমুক্ত বিলাতি পার্চমেন্ট। কিন্তু যে জিনিসটি দেখে আমার মস্তিষ্ক কয়েক মুহূর্তের জন্য সম্পূর্ণ অচল হয়ে গেল, তা হলো সেই পাতার ওপর কালো কালির লেখাগুলো। সেই পরিচিত নির্ভুল টান, অক্ষরের বাঁক, দাড়ি-কমার বিশেষ কোণাকুণি বসানো—সবকিছু আমার চোখের সামনে জ্বলজ্বল করছে। কারণ এই হাতের লেখা কোনো অচেনা খুনির নয়, কোনো অজ্ঞাতনামা শবের নয়। এই হস্তাক্ষর আমার নিজের।

আমি তো গত দশ বছর ধরে এমন কোনো বিলাতি পার্চমেন্টের চামড়ার ডায়েরি ব্যবহার করিনি। কিন্তু লেখার প্রতিটি আঁচড়, 'ক' এবং 'র'-এর সংযোগস্থলের সেই সূক্ষ্ম ত্রুটি—যা কেবল আমার নিজের অবচেতন হাতের দ্রুত লেখাতেই তৈরি হয়—তা এখানে শতভাগ অবিকল। আর সেই পাতার একেবারে শীর্ষে আজকের কোনো তারিখ দেওয়া নেই। সেখানে তারিখ দেওয়া আছে আগামীকালের: ১৮ কার্তিক, ১৩৯৬ (৪ নভেম্বর)। সময়: রাত এগারোটা বিয়াল্লিশ মিনিট।

তার নিচে গাঢ় কালো কালিতে লেখা মাত্র তিনটি বাক্য:

"আজ রাত এগারোটা বিয়াল্লিশে কালিন্দী নদীর পরিত্যক্ত তিন নম্বর জেটিতে আমি রূপম মজুমদারকে খুন করব। কারণ সে আমার চোখ দুটি চুরি করে নিজের অক্ষিকোটরে বসাতে চেয়েছে। আর এই ডায়েরি যে পড়ছে, সে জেনে রাখুক—শীতলকক্ষের কাফনটা খুলে দেখলেই সে বুঝতে পারবে, আমি কে।"

রূপম মজুমদার? আমার মাথার ভেতর যেন সহস্র কাচের বোতল একযোগে ভেঙে চুরমার হয়ে গেল। রূপম মজুমদার তো আমার ঢাকা বিশ্ববিদ্যালয়ের সহপাঠী ছিল, যে সাত বছর আগে ১৯৮৯ সালের ১৪ মে কালিন্দী নদীর ঘূর্ণিজলে নৌকাডুবিতে চিরতরে নিখোঁজ হয়ে গিয়েছিল! রূপমের কোনো দেহ মেলেনি, পুলিশ তার নিখোঁজ ডায়েরি বন্ধ করে ফাইল মহাফেজখানায় ফেলে রেখেছিল। তাহলে আজ রাতে মর্গের এক অজ্ঞাতনামা লাশের পকেট থেকে উদ্ধার হওয়া ডায়েরিতে আমার নিজের হাতের লেখায় আগামীকালের খুনের আগাম স্বীকারোক্তি এল কোথা থেকে?

আমার বাঁ-হাতের বুড়ো আঙুলের ডগায় এক ইঞ্চি লম্বা সাদা পোড়া দাগটা অবচেতনেই ডান হাতের আঙুল দিয়ে ঘষতে লাগলাম—ঠিক যেমন আমি কোনো মারাত্মক মিথ্যা কথা শুনলে বা মারাত্মক আতঙ্কে পড়লে ছোটবেলা থেকেই ঘষি। ঘড়ির পেন্ডুলাম তখন দেওয়ালের গায়ে ঢং ঢং করে জানিয়ে দিল রাত দশটা চল্লিশ। টেবিলের ওপর রাখা ডায়েরির পাতা থেকে সেই তিতা বাদামের গন্ধটা ধীরে ধীরে পুরো ঘরের নিস্তব্ধ বাতাসে ছড়িয়ে পড়ছে।

হঠাৎ আমার চোখ গেল টেবিলের ওপর রাখা ইউভি বাতির আলোর নিচে। ডায়েরির প্রথম পাতার শেষ প্রান্তে, যেখানে কালি শুকিয়ে বিবর্ণ হয়ে গেছে, সেখানে কাগজের আঁশের গভীরে একটি গোপন রক্তাভ জলছাপ ফুটে উঠেছে। একটি মানুষের মুখের অবয়ব—যার চোখের জায়গায় দুটো শূন্য কালো গর্ত, আর তার ঠিক নিচে রক্তমাখা আলপিন দিয়ে খোঁচানো আমার এই ঘরের মেঝের প্রতিটি আসবাবের নিখুঁত মানচিত্র!

let currentStory=null,currentEpisode=0;
function loadStories(){
 const container=document.getElementById("story-container");container.innerHTML="";
 stories.forEach(story=>{
  const card=document.createElement("div");card.className="story-card";
  const img=document.createElement("img");img.src=story.cover;img.alt=story.title;
  const info=document.createElement("div");info.className="story-info";
  const title=document.createElement("h3");title.textContent=story.title;
  const author=document.createElement("p");author.textContent="লেখক: "+story.author;
  const count=document.createElement("p");count.textContent=story.episodes.length+" টি পর্ব";
  info.append(title,author,count);card.append(img,info);card.onclick=()=>openStory(story.id);container.appendChild(card);
 });
}
function openStory(id){
 currentStory=stories.find(s=>s.id===id);
 document.getElementById("home").style.display="none";document.getElementById("reader").style.display="block";
 document.getElementById("story-title").textContent=currentStory.title;
 document.getElementById("story-author").textContent="লেখক: "+currentStory.author;
 const list=document.getElementById("episode-list");list.innerHTML="<h3>গল্পের পর্বসমূহ</h3>";
 currentStory.episodes.forEach((episode,index)=>{
  const item=document.createElement("div");item.className="episode";item.textContent=episode.title+"  →";
  item.onclick=()=>showEpisode(index);list.appendChild(item);
 });
 document.getElementById("episode-content").style.display="none";window.scrollTo(0,0);
}
function showEpisode(index){
 if(index<0||index>=currentStory.episodes.length)return;
 currentEpisode=index;const episode=currentStory.episodes[index];
 document.getElementById("episode-content").style.display="block";
 document.getElementById("episode-title").textContent=episode.title;
 document.getElementById("episode-text").textContent=episode.content;window.scrollTo(0,0);
}
function nextEpisode(){if(currentEpisode<currentStory.episodes.length-1)showEpisode(currentEpisode+1);else alert("এটাই এখন পর্যন্ত শেষ পর্ব। নতুন পর্ব শীঘ্রই আসবে।")}
function previousEpisode(){if(currentEpisode>0)showEpisode(currentEpisode-1);else alert("এটি প্রথম পর্ব।")}
function showHome(){document.getElementById("home").style.display="block";document.getElementById("reader").style.display="none";window.scrollTo(0,0)}
loadStories();
</script>
